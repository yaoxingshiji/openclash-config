; REJECT 测速失败，不会抢占健康节点。全部节点失效时不承诺自动回退直连。
; “其他”是下列六个地区匹配条件的补集；修改地区条件时需同步更新“其他”。
custom_proxy_group=所有-手动`select`.*`[]REJECT
