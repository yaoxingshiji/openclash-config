[custom]
add_emoji=false
remove_old_emoji=false
; OpenClash 多地区组合与AI细分版 | 2026-10-30 | UTF-8
; 39条ruleset、39个策略组；细分AI及自有规则由本仓库托管。
; 用途：subconverter / OpenClash 的订阅转换 INI；不是直接导入 Clash 的 YAML。
; 仍需配合自己的节点订阅。推荐 Mihomo 内核，使用规则模式。
; 各业务和漏网组独立选择；无历史选择时首项DIRECT生效，请为国外业务选择节点组。
; 地区依节点名称识别；没有相应节点时该组为 REJECT，不会自动直连。
; 测速只检测网络连通性；AI/流媒体可用地区需按实际节点选择。
; 更新后检查已保存选择：ChatGPT/国外/漏网之鱼等需选代理；国内可保持DIRECT。

enable_rule_generator=true
overwrite_original_rules=true

; 1. 局域网优先直连，避免漏网代理影响路由器和本地服务。
ruleset=DIRECT,[]DOMAIN-SUFFIX,home.arpa
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list

; 2. 流媒体具体规则优先于 Google / Amazon 等公共云及品牌规则。
; 移除原自定义 YouTube.list 的无关 IP 段，使用完整 YouTube 规则源。
ruleset=🎞️ YouTube,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list
ruleset=📺 Disney,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Disney/Disney.list
ruleset=🎥 Netflix,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.list
ruleset=🎬 HBO,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/HBO/HBO.list
ruleset=🎵 Spotify,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify.list

; 3. AI 仅匹配服务域名；公共鉴权、支付、统计/CDN 走各自规则或漏网之鱼。
; 不再匹配整个 x.com、bing.com、googleapis.com、gstatic.com。
; 参考：blackmatrix7 的 OpenAI / Copilot / Gemini / Claude 列表，筛除共享域名。
; 细分AI先于总AI：专属主机及已确认的精确登录依赖。
ruleset=✨ ChatGPT,https://raw.githubusercontent.com/yaoxingshiji/openclash-config/main/rules/openclash-combined/ChatGPT.list?v=7ccb9408a41c
ruleset=✨ Copilot,https://raw.githubusercontent.com/yaoxingshiji/openclash-config/main/rules/openclash-combined/Copilot.list
ruleset=✨ Gemini,https://raw.githubusercontent.com/yaoxingshiji/openclash-config/main/rules/openclash-combined/Gemini.list
ruleset=✨ Claude,https://raw.githubusercontent.com/yaoxingshiji/openclash-config/main/rules/openclash-combined/Claude.list
ruleset=✨ AI,https://raw.githubusercontent.com/yaoxingshiji/openclash-config/refs/heads/main/rules/AI.list
ruleset=✨ Meta AI,https://raw.githubusercontent.com/yaoxingshiji/openclash-config/refs/heads/main/rules/MetaAI.list
ruleset=✨ Perplexity,[]DOMAIN-SUFFIX,perplexity.ai

; 4. Bybit 转成兼容格式。full: 用精确 DOMAIN，其余用 DOMAIN-SUFFIX。
; 必须在 GitHub 前：bybit-exchange.github.io 属于 Bybit。
; 源：https://github.com/v2fly/domain-list-community/blob/master/data/bybit
ruleset=👌 虚拟币,https://raw.githubusercontent.com/yaoxingshiji/openclash-config/refs/heads/main/rules/Crypto.list
ruleset=👌 虚拟币,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/OKX/OKX.list

; 5. 其他业务。具体服务优先于品牌与公共基础设施。
ruleset=📘 GitHub,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/GitHub/GitHub.list
ruleset=🪂 TikTok,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/TikTok/TikTok.list
ruleset=🙋 Telegram,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list
ruleset=🕊️ Twitter(X),https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Twitter/Twitter.list
ruleset=💁 WhatsApp,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Whatsapp/Whatsapp.list
ruleset=🗣️ Facebook,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Facebook/Facebook.list
ruleset=🎮 Steam,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Steam/Steam.list
ruleset=🕹️ Game,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Epic/Epic.list
ruleset=🕹️ Game,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/EA/EA.list
ruleset=🕹️ Game,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Blizzard/Blizzard.list
ruleset=🕹️ Game,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/UBI/UBI.list
ruleset=🕹️ Game,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Sony/Sony.list
ruleset=🕹️ Game,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Nintendo/Nintendo.list
ruleset=🍎 Apple,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Apple/Apple.list
ruleset=Ⓜ️ Microsoft,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Microsoft/Microsoft.list
ruleset=🌳 Amazon,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Amazon/Amazon.list

; 6. 专用检测网站并入国外组；公共验证码等仍按其域名规则处理。
; fast.com 仍优先服从 Netflix 组，与其视频出口一致。
ruleset=🌍 国外,https://raw.githubusercontent.com/yaoxingshiji/openclash-config/refs/heads/main/rules/Check.list
ruleset=🔍 Google,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Google/Google.list

; 7. 明确国内域名直连；业务单独设置优先于国内通用表。
ruleset=➡️ 国内,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list

; 8. 通用国外规则之后，按中国 GeoIP 直连；其余由独立漏网组承接。
; GEOIP,CN 不加 no-resolve，可识别域名表未收录的国内地址；需客户端 GeoIP 数据。
ruleset=🌍 国外,https://raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/Proxy.list
ruleset=🌍 国外,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Global/Global.list
ruleset=➡️ 国内,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; 9. 业务策略：DIRECT统一最左；每组独立选择，所有选项顺序一致。
