; 10. 节点组：REJECT 作为末尾哨兵，避免无匹配节点时转换器自动补 DIRECT。
; REJECT 测速失败，不会抢占健康节点。全部节点失效时不承诺自动回退直连。
; “其他”是下列六个地区匹配条件的补集；修改地区条件时需同步更新“其他”。
custom_proxy_group=所有-手动`select`.*`[]REJECT
custom_proxy_group=所有-自动`url-test`.*`[]REJECT`https://www.gstatic.com/generate_204`180,5,100
